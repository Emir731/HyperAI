name: HyperAI cross-platform validation

on:
  push:
    branches:
      - feature/hyperai-offline-redesign
  pull_request:
    branches:
      - feature/hyperai-offline-redesign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperai-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  android:
    name: Android analyze, tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format and verify Dart sources
        run: |
          dart format .
          git diff --check

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperai-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build (unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve Flutter and CocoaPods dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphonesimulator/Runner.app \
            build/ios/HyperAI-iOS-Simulator.zip

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: hyperai-ios-simulator-unsigned
          path: build/ios/HyperAI-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
